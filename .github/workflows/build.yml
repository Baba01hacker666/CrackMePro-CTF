name: Build CTF APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK packages
        # NOTE: ubuntu-latest runners already ship an Android SDK
        # ($ANDROID_HOME). We only ensure the exact platform / NDK / CMake
        # this project needs — no third-party setup action required.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" \
            "build-tools;34.0.0" "platform-tools" \
            "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11

      - name: Build debug APK (playable CTF artifact)
        run: gradle assembleDebug --stacktrace

      - name: Build release APK (R8 obfuscated CTF artifact)
        run: gradle assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: crackme-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
